name: Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: iOS
          versioning: None

      - name: Build and package unsigned IPA
        run: |
          set -euo pipefail
          project=$(find "$GITHUB_WORKSPACE/build/iOS" -name Unity-iPhone.xcodeproj -print -quit)
          test -n "$project" || { echo "Unity Xcode project not found" >&2; exit 1; }
          xcodebuild -project "$project" -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
          app=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app" || { echo "Built iOS app not found" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/ipa"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/$(basename "$app")"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/ipa/unsigned.ipa" Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: ipa/*.ipa
          if-no-files-found: error
